[project]
name = "recept"
version = "0.1.0"
description = "AI recept: od Instagram brenda do tri gotove objave (brif -> analiza -> plan -> izrada -> provjera -> isporuka)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "openai>=2.0",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "pillow>=11.0",
    "imageio-ffmpeg>=0.5",
    "python-dotenv>=1.0",
    "markdown>=3.6",
    "pymupdf>=1.24",
    "rembg[cpu]>=2.0",
]

[project.scripts]
recept = "recept.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recept"]

[dependency-groups]
dev = ["pytest>=8.0"]
